[tool.poetry]
name = "marker-pdf"
version = "1.10.2"
description = "Convert documents to markdown with high speed and accuracy."
authors = ["Vik Paruchuri <github@vikas.sh>"]
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/VikParuchuri/marker"
keywords = ["pdf", "markdown", "ocr", "nlp"]
packages = [
    {include = "marker"}
]
include = [
    "marker/scripts/*.sh",
    "marker/scripts/*.html",
]

[tool.poetry.dependencies]
python = "^3.10"
# Relaxed from "^10.1.0" (<11) per datalab-to/surya#519 (pillow<11 -> <13,
# tested against 12.2.0) -- surya's own cap was the transitive blocker.
Pillow = ">=10.1.0,<13"
pydantic = "^2.4.2"
pydantic-settings = "^2.0.3"
# Relaxed from "^4.45.2" (<5) -- verified surya-ocr (patched fork below)
# passes its full test suite under both transformers 4.57.6 and 5.13.0.
# Capped at <6 since 6.x doesn't exist yet / hasn't been tested.
transformers = ">=4.45.2,<6"
python-dotenv = "^1.0.0"
torch = "^2.7.0"
tqdm = "^4.66.1"
ftfy = "^6.1.1"
rapidfuzz = "^3.8.1"
# Pinned to a COMMIT (not a branch -- flagged in security review: a branch
# ref is mutable and could be force-pushed/amended without this lockfile
# changing, unlike the hash-pinned PyPI release this replaces) on the
# transformers-5.x/Pillow-12.x-compat fork -- see that repo's commit for
# the full list of fixes (RoPE meta-device recompute + rope_init_fn
# dispatch, dataclass config pad_token_id, missing post_init(),
# _tied_weights_keys format, removed-symbol polyfills). Same 0.17.1 API
# surface; no marker code changes needed. Interim measure pending upstream
# PRs #519/#520 merging. Branch python314-compat-0.17.1 for reference/updates.
surya-ocr = {git = "https://github.com/gkriegspeedbay/surya.git", rev = "c145d3e1c91bb483cdc9662a34d9b5042a641d10"}
# Relaxed from "^2024.4.28" (<2025) -- the old cap had no cp314 (Python
# 3.14) wheel available in its range; open-ended to let the resolver pick
# the latest compatible build.
regex = ">=2024.4.28"
# Bumped from "~0.6.3" (STANDARDS SS6.9.1 bump flow: reviewed all 18 commits
# between v0.6.3 and v0.7.0 -- correctness fixes, perf optimizations
# (explicitly "byte-identical output, golden-diff verified" per the
# commits), and additive features (encrypted-PDF password support). No
# breaking change to table_output/dictionary_output/Reference/flatten, the
# APIs marker actually calls. Also REQUIRED: 0.7.0 is the release that
# upgrades pdftext's own pypdfium2 pin to 5.9.0, matching surya's pin
# above -- pdftext 0.6.3 hard-pins pypdfium2==4.30.0, which would otherwise
# conflict with surya's bumped pin and make this whole dependency set
# unresolvable.
pdftext = "~0.7.0"
markdownify = "^1.1.0"
click = "^8.2.0"
markdown2 = "^2.5.2"
filetype = "^1.2.0"
# Bumped from "^1.0.0" (STANDARDS SS6.9.1: floor-only 0.x/pre-1.0 constraints
# get pinned to a single minor by Poetry's caret semantics -- "^1.0.0" means
# >=1.0.0,<2.0.0, silently freezing at whatever 1.x was current when this
# was first written, forever, regardless of how often poetry lock reruns.
# google-genai crossed to 2.0.0 on 2026-05-07; its own release notes scope
# the breaking changes to the new Interactions API only ("GenerateContent
# usage is unaffected"). marker/marker/services/gemini.py and vertex.py use
# exactly the classic GenerateContent surface (genai.Client, .models.
# generate_content, types.Part.from_bytes, types.ThinkingConfig) -- verified
# unchanged in 2.10.0.
google-genai = "^2.10.0"
# Bumped from "^0.46.0" (same caret-freeze issue as above). No breaking API
# change between 0.46.0 and 0.116.0 affects marker/marker/services/claude.py's
# usage (anthropic.Anthropic(...), client.messages.create(...), RateLimitError/
# APITimeoutError) -- verified unchanged in 0.116.0.
anthropic = "^0.116.0"
pre-commit = "^4.2.0"
scikit-learn = "^1.6.1"

# Optional dependencies for documents
mammoth = {version = "^1.9.0", optional = true}
openpyxl = {version = "^3.1.5", optional = true}
python-pptx = {version = "^1.0.2", optional = true}
ebooklib = {version = "^0.18", optional = true}
weasyprint = {version = "^63.1", optional = true}
# Bumped from "^1.65.2" (same caret-freeze issue). openai 2.0.0's only
# documented breaking change (per GitHub release notes) is scoped to the
# Responses API's tool-call-output typing, not the Chat Completions surface
# marker/marker/services/openai.py actually uses (client.beta.chat.completions.
# parse(...), response.choices[0].message.content) -- verified unchanged
# (and still callable via the beta alias) in 2.44.0.
openai = "^2.44.0"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
datasets = "^2.21.0"
streamlit = "^1.37.1"
# Bumped fastapi/starlette(transitive)/uvicorn/python-multipart together
# (STANDARDS SS6.9.1) -- these back the real marker_server console-script
# entry point (marker/scripts/server.py: FastAPI/Form/File/UploadFile,
# starlette.responses.HTMLResponse, uvicorn), not just the streamlit demo,
# even though they live in this dev group (a pre-existing upstream
# packaging choice, not something this fork changed). fastapi was pinned
# to "^0.115.4" (Poetry caret-freeze), which ALSO capped its own starlette
# dependency at <0.47.0 -- starlette's real latest is 1.3.1. fastapi
# 0.133.0 (PR #14987, "Add support for Starlette 1.0.0+") is the release
# that lifts that ceiling entirely. Verified via a combined dry-run: all
# four packages resolve simultaneously to true latest with zero conflicts.
fastapi = "^0.139.0"
uvicorn = "^0.50.0"
python-multipart = "^0.0.32"
pytest = "^8.3.3"
pytest-mock = "^3.14.0"
apted = "1.0.3"
distance = "0.1.3"
# Bumped from the exact pin "5.3.0" (STANDARDS SS6.9.1) -- an undocumented,
# unmaintained exact pin (sits next to other exact-pinned test-fixture
# tooling like apted/distance, but nothing else in the graph caps lxml;
# verified via a clean poetry lock with no other package forced to move).
lxml = "6.1.1"
tabulate = "^0.9.0"
latex2mathml = "^3.77.0"
playwright = "^1.49.1"

[tool.poetry.extras]
full = ["mammoth", "openpyxl", "python-pptx", "ebooklib", "weasyprint"]

[tool.poetry.scripts]
marker = "marker.scripts.convert:convert_cli"
marker_single = "marker.scripts.convert_single:convert_single_cli"
marker_chunk_convert = "marker.scripts.chunk_convert:chunk_convert_cli"
marker_gui = "marker.scripts.run_streamlit_app:streamlit_app_cli"
marker_extract = "marker.scripts.run_streamlit_app:extraction_app_cli"
marker_server = "marker.scripts.server:server_cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
